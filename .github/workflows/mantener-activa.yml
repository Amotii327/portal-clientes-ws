name: Mantener activa la base (desarrollo)
# Mientras el proyecto de Supabase esté en plan gratuito, se pausa tras 7 días sin uso.
# Esta tarea se conecta una vez al día para evitarlo. Al pasar a Pro se puede borrar.
# Aprobado por el dueño el 2026-11-20.
on:
  schedule:
    - cron: "17 13 * * *"   # todos los días, 8:17 a. m. hora Colombia
  workflow_dispatch:
jobs:
  consultar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: icinxatqxbpdvssdecke
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: {version: latest}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Consultar la base (solo lectura)
        run: supabase migration list --linked
